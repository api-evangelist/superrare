- name: SuperRare Rare Protocol CLI
  description: >-
    Command-line interface and SDK for deploying ERC-721 NFT collections, minting tokens, managing reserve-price
    auctions, and querying tokens and collections on Ethereum Mainnet, Sepolia, Base, and Base Sepolia.
    Includes Model Context Protocol (MCP) server for AI agent integration.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/superrare/rare-cli
  baseURL: https://api.superrare.com
  tags:
