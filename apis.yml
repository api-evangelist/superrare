    url: https://github.com/superrare
    email: ''
- name: SuperRare Smart Contracts - The Bazaar
  description: >-
    Unified marketplace and auction house smart contract on Ethereum that enables reserve-price auctions,
    sale price listings, offer placement, and bid management for curated digital art NFTs. Supports non-custodial
    transactions and the conversion of offers into auction bids.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.superrare.com/smart-contracts/the-bazaar/
  baseURL: https://ethereum.org
  tags:
