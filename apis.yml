- name: SuperRare Profile & Creator API
  description: >-
    SDK and CLI for programmatic management of rare.xyz creator profiles, storefronts, products, posts,
    social interactions, messages, analytics, and events. Uses OAuth device flow authentication with scoped
    personal access tokens.
