- name: SuperRare Smart Contracts - Assets (ERC-721)
  description: >-
    SuperRare ERC-721 NFT asset contracts including shared minting contracts (SuperRareV1, SuperRareV2),
    creator-owned Sovereign minting contracts (Series), and curator-managed Space contracts. The Approved
    Token Registry controls which tokens are supported by the Bazaar marketplace.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.superrare.com/smart-contracts/assets/
